name: Recipe source audit\non:\n  push:\n    branches: [recipe-source-audit]\njobs:\n  audit:\n    if: \${{ !contains(github.event.head_commit.message, '[source-audit]') }}\n    runs-on: ubuntu-latest\n    permissions:\n      contents: write\n    steps:\n      - uses: actions/checkout@v4\n        with:\n          ref: recipe-source-audit\n      - uses: actions/setup-node@v4\n        with:\n          node-version: 22\n          cache: npm\n      - run: npm ci\n      - run: node scripts/refresh-recipes-from-sources.mjs\n      - run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"\n          git add recipes.json recipe-source-audit.json\n          git commit -m "Refresh recipes from source pages [source-audit]" || exit 0\n          git push\n