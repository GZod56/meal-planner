<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Planner</title>
<meta name="theme-color" content="#F6F1E6">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Meal Planner">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&display=swap" rel="stylesheet">
<style>
:root{ --paper:#F6F1E6; --raise:#FCF8F0; --ink:#221D16; --soft:#6F6455; --hair:#DCD1BC; --hair-dot:#C7B99D; --ox:#6E2B32; --thumb:#EDE6D6; }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper); color:var(--ink); font-family:'Fraunces',Georgia,serif; font-optical-sizing:auto; -webkit-font-smoothing:antialiased; font-size:16px; line-height:1.45; font-feature-settings:"ss01" 1, "swsh" 0, "salt" 0}
button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer; text-align:left}
a{color:var(--ox); text-decoration:none; border-bottom:1px dotted var(--hair-dot)}
:focus-visible{outline:1.5px solid var(--ox); outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
input,textarea{font:inherit; border-radius:0}
#view{max-width:640px; margin:0 auto; padding:24px 20px 112px}
.label{font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; font-weight:600; color:var(--soft)}
.section{margin-top:30px}
.section>.label{display:block; padding-bottom:7px; border-bottom:1px solid var(--hair); margin-bottom:12px}
.mast{position:relative; padding-top:2px; margin-bottom:6px}
.mast .wk{font-size:20px; font-weight:540; letter-spacing:.13em; text-transform:uppercase; font-optical-sizing:none; font-feature-settings:"ss01" 1,"swsh" 0,"salt" 0,"case" 1}
.mast .wk::first-letter{font-size:1.26em; letter-spacing:.02em}
.mast .sub{font-size:10.5px; letter-spacing:.22em; text-transform:uppercase; color:var(--soft); margin-top:5px; font-feature-settings:"ss01" 1,"case" 1}
.dots{position:absolute; right:-6px; top:-2px; font-size:22px; color:var(--soft); padding:4px 8px; line-height:1}
.axis{display:flex; justify-content:flex-end; margin-top:14px}
.axis .k{font-size:9px; letter-spacing:.16em; text-transform:uppercase; color:var(--soft)}
.item{display:flex; gap:12px; align-items:flex-start; width:100%; padding:7px 0}
.thumb{flex:none; width:46px; height:46px; border-radius:2px; background:var(--thumb) center/cover no-repeat; border:1px solid var(--hair)}
.thumb.ph{display:flex; align-items:center; justify-content:center; color:var(--hair-dot); font-size:17px}
.body{flex:1; min-width:0}
.dline{display:flex; align-items:baseline; gap:9px; width:100%}
.dish{font-size:18px; font-weight:520; letter-spacing:.005em}
.leader{flex:1; border-bottom:1px dotted var(--hair-dot); transform:translateY(-4px); min-width:14px}
.macros{font-size:13px; white-space:nowrap; font-variant-numeric:lining-nums; letter-spacing:.02em}
.tdot{display:inline-block; width:5px; height:5px; border-radius:50%; background:var(--ox); margin-right:6px; transform:translateY(-2px)}
.detail{font-size:12px; font-style:italic; color:var(--soft); margin-top:2px}
.rowacts{display:flex; gap:16px; margin-top:5px}
.act{font-size:10px; letter-spacing:.14em; text-transform:uppercase; font-weight:600; color:var(--ox)}
.dishswap{margin-top:6px; color:var(--ox)}
.dishswap .sw-label{font-size:10px; letter-spacing:.16em; text-transform:uppercase; font-weight:600; color:var(--ox)}
.dishswap .swap{color:var(--ox); font-size:12px}
.dishswap .leader{border-bottom-color:var(--hair-dot)}
.sides{margin-top:7px}
.side-row{display:flex; align-items:baseline; gap:9px; width:100%; padding:2.5px 0; font-size:14px}
.side-row .swap{color:var(--ox); font-size:12px}
.xform{margin-top:11px; padding-top:9px; border-top:1px dotted var(--hair)}
.xform .label{font-size:9px}
.xform-row{display:flex; align-items:baseline; gap:9px; width:100%; font-size:14.5px; padding-top:3px}
.xform-row .swap{color:var(--ox); font-size:12px}
.xform-row .note{font-style:italic; color:var(--soft); font-size:12px}
.slotgap{height:12px}
.search{width:100%; background:transparent; border:none; border-bottom:1px solid var(--hair); font-size:16px; padding:8px 2px; color:var(--ink)}
.search::placeholder{color:var(--soft); font-style:italic}
.chips{display:flex; gap:22px; margin:15px 0 2px}
.chip{font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; font-weight:600; color:var(--soft); padding-bottom:3px; border-bottom:1px solid transparent}
.chip.on{color:var(--ox); border-bottom-color:var(--ox)}
.count{font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); margin:14px 0 4px}
.lib-item{display:flex; gap:12px; align-items:center; width:100%; padding:7px 0}
.lib-item .dish{font-size:15.5px; font-weight:460}
.lib-item .min{font-size:12px; color:var(--soft); font-variant-numeric:lining-nums; white-space:nowrap}
#tabs{position:fixed; left:0; right:0; bottom:0; background:var(--paper); border-top:1px solid var(--hair); display:flex; justify-content:space-around; align-items:center; padding:11px 12px calc(11px + env(safe-area-inset-bottom)); z-index:40}
#tabs button{font-size:10px; letter-spacing:.13em; text-transform:uppercase; font-weight:600; color:var(--soft); padding:2px 2px 6px; position:relative}
#tabs button.on{color:var(--ink)}
#tabs button.on:not(.chef)::after{content:''; position:absolute; left:50%; bottom:0; width:4px; height:4px; border-radius:50%; background:var(--ox); transform:translateX(-50%)}
#tabs .chef{width:48px; height:48px; border:1px solid var(--ink); border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink); margin-top:-20px; padding:0; background:var(--paper); flex:none}
#tabs .chef.on{background:var(--ox); border-color:var(--ox); color:var(--paper)}
/* chat */
.chat-wrap{padding-bottom:96px}
.msg{margin:16px 0; max-width:88%}
.msg.user{margin-left:auto}
.msg .who{font-size:9px; letter-spacing:.2em; text-transform:uppercase; color:var(--soft); margin-bottom:5px}
.msg.user .who{text-align:right}
.msg .bub{font-size:15.5px; line-height:1.52}
.msg.user .bub{display:inline-block; background:var(--ink); color:var(--paper); padding:9px 13px; border-radius:3px; text-align:left}
.msg.assistant .bub{color:var(--ink)}
.msg .bub strong{font-weight:600}
.chat-load{font-style:italic; color:var(--soft); font-size:14.5px; margin:16px 0}
.chip-row{display:flex; flex-wrap:wrap; gap:9px; margin-top:16px}
.pchip{border:1px solid var(--hair); background:var(--raise); padding:9px 13px; font-size:13.5px; color:var(--ink); border-radius:3px}
#chatbar{position:fixed; left:0; right:0; bottom:calc(62px + env(safe-area-inset-bottom)); z-index:41; display:flex; gap:9px; align-items:flex-end; max-width:640px; margin:0 auto; padding:9px 16px; background:linear-gradient(to top, var(--paper) 70%, rgba(246,241,230,0))}
#chatbar[hidden]{display:none}
#chatIn{flex:1; background:var(--raise); border:1px solid var(--hair); border-radius:20px; font-size:15.5px; padding:10px 16px; color:var(--ink); resize:none; max-height:120px; line-height:1.4}
#chatIn::placeholder{color:var(--soft); font-style:italic}
#chatSend{flex:none; width:40px; height:40px; border-radius:50%; background:var(--ox); color:var(--paper); font-size:19px; display:flex; align-items:center; justify-content:center; line-height:1}
#chatSend:disabled{opacity:.4}
.gen-hero{text-align:center; padding:44px 8px 20px}
.gen-hero .big{font-size:27px; font-weight:560; line-height:1.2}
.gen-hero p{color:var(--soft); font-style:italic; font-size:15px; margin:10px auto 0; max-width:400px}
.gen-btn{display:inline-block; margin-top:24px; border:1px solid var(--ink); padding:11px 26px; font-size:11px; letter-spacing:.2em; text-transform:uppercase; font-weight:600}
.gen-btn.primary{background:var(--ink); color:var(--paper)}
.inv{width:100%; background:var(--raise); border:1px solid var(--hair); font-size:14px; padding:11px; color:var(--ink); min-height:64px; margin-top:8px}
.inv-note{font-size:11.5px; color:var(--soft); font-style:italic; margin-top:6px}
#overlay{position:fixed; inset:0; background:var(--paper); z-index:60; overflow-y:auto; display:none; -webkit-overflow-scrolling:touch}
#overlay.open{display:block}
.ov-inner{max-width:640px; margin:0 auto; padding:18px 20px 92px}
.back{font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; font-weight:600; color:var(--ox); padding:6px 0}
.rphoto{width:100%; max-height:250px; object-fit:cover; border:1px solid var(--hair); margin:12px 0 2px; display:block}
.rname{font-size:25px; font-weight:560; line-height:1.15; margin:14px 0 6px}
.rmeta{font-size:13px; color:var(--soft); font-variant-numeric:lining-nums}
.rmeta a{font-size:13px}
.rtags{font-size:9.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--soft); margin-top:8px}
.rmac{font-size:13px; color:var(--soft); font-variant-numeric:lining-nums; margin-top:8px}
.photo-btn{font-size:10.5px; letter-spacing:.18em; text-transform:uppercase; font-weight:600; color:var(--ox); margin-top:12px; display:inline-block}
.scaler{display:flex; gap:18px; margin-top:6px}
.scaler .opt{font-size:14.5px; color:var(--soft); padding-bottom:2px; border-bottom:1px solid transparent; font-variant-numeric:lining-nums}
.scaler .opt.on{color:var(--ink); border-bottom-color:var(--ox)}
.ing,.step{display:block; width:100%; font-size:15.5px}
.ing{padding:5px 0}
.step{padding:7px 0}
.step .n{font-size:10.5px; letter-spacing:.1em; color:var(--soft); font-variant-numeric:lining-nums; margin-right:8px}
.done{color:var(--soft); text-decoration:line-through; text-decoration-color:var(--ox)}
.qty{color:var(--ox)}
.notes p{font-style:italic; color:var(--soft); font-size:14.5px; margin:8px 0}
.check-row{display:flex; align-items:flex-start; gap:13px; padding:8px 0; font-size:15px; width:100%}
.ck{flex:none; width:15px; height:15px; border:1px solid var(--soft); border-radius:50%; margin-top:4px}
.check-row.on .ck{background:var(--ox); border-color:var(--ox)}
.check-row.on .t{color:var(--soft); text-decoration:line-through; text-decoration-color:var(--ox)}
.shop-cat{margin-top:22px}
.shop-cat .label{display:block; padding-bottom:6px; border-bottom:1px solid var(--hair); margin-bottom:6px}
.shop-cat .sk{font-size:12px; color:var(--soft); font-style:italic; text-transform:none; letter-spacing:0; font-weight:400}
#sheet{position:fixed; inset:0; background:rgba(34,29,23,.30); z-index:70; display:none}
#sheet.open{display:block}
.sheet-inner{position:absolute; left:0; right:0; bottom:0; background:var(--raise); border-top:1px solid var(--hair); padding:20px 22px calc(26px + env(safe-area-inset-bottom)); max-width:640px; margin:0 auto; max-height:82vh; overflow-y:auto}
.sheet-inner .label{display:block; margin-bottom:12px}
.sheet-btn{display:block; width:100%; font-size:15px; padding:11px 0; border-bottom:1px solid var(--hair)}
.sheet-btn small{display:block; font-size:12px; color:var(--soft); font-style:italic; margin-top:2px}
.alt{display:flex; gap:12px; align-items:center; width:100%; padding:10px 0; border-bottom:1px solid var(--hair)}
.alt .dish{font-size:16px; font-weight:490}
.alt .mm{font-size:11.5px; color:var(--soft); font-variant-numeric:lining-nums; white-space:nowrap; margin-left:auto}
.sheet-area{width:100%; min-height:96px; margin-top:10px; background:var(--paper); border:1px solid var(--hair); font-size:12.5px; padding:10px; color:var(--ink)}
.sheet-note{font-size:11.5px; color:var(--soft); font-style:italic; margin-top:12px}
.field{margin-top:14px}
.field label{display:block; font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--soft); margin-bottom:5px}
.field input{width:100%; background:var(--paper); border:1px solid var(--hair); padding:9px; font-size:15px; color:var(--ink)}
.save-row{display:flex; gap:10px; margin-top:18px}
.save-row button{border:1px solid var(--ink); padding:9px 20px; font-size:11px; letter-spacing:.16em; text-transform:uppercase; font-weight:600}
.save-row .primary{background:var(--ink); color:var(--paper)}
.empty{font-style:italic; color:var(--soft); font-size:14.5px; padding:10px 0}

/* ---- inline ingredient amounts ---- */
.amt{color:var(--ox); font-size:.88em; white-space:nowrap}
.c-step .amt{font-size:.72em; vertical-align:.08em}

/* ---- cook mode ---- */
#cook{position:fixed; inset:0; z-index:80; background:var(--paper); display:flex;
  flex-direction:column; padding:max(14px,env(safe-area-inset-top)) 0 0;
  overscroll-behavior:contain; touch-action:pan-y}
.c-top{display:flex; align-items:center; gap:14px; padding:0 20px 12px}
.c-x{font-size:17px; color:var(--soft); line-height:1; padding:4px 2px}
.c-name{flex:1; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  font-weight:600; color:var(--soft); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.c-count{font-size:13px; color:var(--soft); font-variant-numeric:lining-nums}
.c-count span{color:var(--hair-dot)}
.c-bar{height:1px; background:var(--hair); margin:0 20px}
.c-bar i{display:block; height:1px; background:var(--ox); transition:width .28s ease}
.c-body{flex:1; overflow-y:auto; display:flex; flex-direction:column; justify-content:center;
  padding:26px 24px; gap:30px; -webkit-overflow-scrolling:touch}
.c-step{font-size:27px; line-height:1.32; font-weight:420; max-width:600px;
  margin:0 auto; width:100%}
.c-step .qty{color:var(--ox)}
.c-timer{align-self:center; position:relative; overflow:hidden; background:var(--raise);
  border:1px solid var(--hair); border-radius:2px; padding:14px 30px; text-align:center; min-width:180px}
.c-timer i{position:absolute; left:0; top:0; bottom:0; width:0; background:var(--thumb); z-index:0}
.c-timer span,.c-timer em{position:relative; z-index:1; display:block}
.c-timer span{font-size:30px; font-variant-numeric:lining-nums tabular-nums; line-height:1.1}
.c-timer em{font-style:normal; font-size:9.5px; letter-spacing:.2em; text-transform:uppercase;
  font-weight:600; color:var(--soft); margin-top:5px}
.c-timer.done{border-color:var(--ox)}
.c-timer.done span{color:var(--ox)}
.c-nav{display:flex; align-items:center; gap:10px; padding:12px 20px;
  padding-bottom:max(12px,env(safe-area-inset-bottom)); border-top:1px solid var(--hair)}
.c-nav>[data-go]{font-size:22px; color:var(--ink); padding:8px 20px; border:1px solid var(--hair);
  border-radius:2px; line-height:1; min-width:70px; text-align:center}
.c-nav>[data-go][disabled]{opacity:.25}
.c-nav>[data-go="1"]{margin-left:auto; font-size:19px}
.c-ings{font-size:10px; letter-spacing:.2em; text-transform:uppercase; font-weight:600; color:var(--ox)}
.c-tray{position:absolute; left:0; right:0; bottom:0; z-index:2; background:var(--raise);
  border-top:1px solid var(--hair); transform:translateY(calc(100% - 22px));
  transition:transform .3s cubic-bezier(.32,.72,0,1); max-height:74%; display:flex; flex-direction:column}
#cook.ing-open .c-tray{transform:translateY(0)}
.c-grab{height:22px; width:100%; position:relative; flex:none}
.c-grab::after{content:''; position:absolute; left:50%; top:9px; width:38px; height:3px;
  margin-left:-19px; border-radius:2px; background:var(--hair-dot)}
.c-tray-in{overflow-y:auto; padding:4px 24px max(22px,env(safe-area-inset-bottom))}
.c-tray-in .label{display:block; padding-bottom:7px; border-bottom:1px solid var(--hair); margin-bottom:8px}
@media(max-width:380px){ .c-step{font-size:23px} }
@media(min-height:820px){ .c-step{font-size:30px} }

/* ---- library sections ---- */
.secs{display:flex; gap:22px; margin:16px 0 0; border-bottom:1px solid var(--hair); padding-bottom:10px}
.sec{font-size:15px; color:var(--soft); padding-bottom:9px; margin-bottom:-11px;
  border-bottom:1.5px solid transparent}
.sec.on{color:var(--ink); border-bottom-color:var(--ox)}
.sec i{font-style:normal; font-size:10.5px; color:var(--hair-dot); margin-left:5px;
  font-variant-numeric:lining-nums}
.secs+.chips{margin-top:13px}
.library-tools{flex-wrap:wrap;gap:14px 22px;margin-top:18px}
.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.field select{width:100%;font:inherit;padding:9px;background:var(--paper);color:var(--ink);border:1px solid var(--hair)}
.field input[type="checkbox"]{width:auto;margin-right:8px}
.sheet-inner p[role="alert"]{color:var(--ox);font-size:14px}
</style>
</head>
<body>
<main id="view"><div class="mast"><div class="wk">Library</div><div class="sub">Loading recipes…</div></div></main>
<nav id="tabs" aria-label="Sections">
  <button data-tab="library" class="on">Library</button>
  <button data-tab="week">Week</button>
  <button data-tab="chef" class="chef" aria-label="Ask ChatGPT kitchen assistant">
    <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6.2 13.2C4.3 12.7 3 11.1 3 9.2 3 7 4.9 5.2 7.2 5.2c.35 0 .69.04 1.02.12C8.9 3.6 10.32 2.6 12 2.6s3.1 1 3.76 2.72c.33-.08.67-.12 1.02-.12C19.1 5.2 21 7 21 9.2c0 1.9-1.3 3.5-3.2 4"></path>
      <path d="M6.2 13.2V19.4c0 .55.45 1 1 1h9.6c.55 0 1-.45 1-1v-6.2"></path>
      <path d="M9.4 13.4v3.1M12 13.4v3.1M14.6 13.4v3.1"></path></svg>
  </button>
  <button data-tab="prep">Prep</button>
  <button data-tab="shopping">Shop</button>
</nav>
<div id="chatbar" hidden="">
  <textarea id="chatIn" rows="1" placeholder="Ask about tonight&#39;s cook…" autocomplete="off"></textarea>
  <button id="chatSend" aria-label="Send">↑</button>
</div>
<div id="overlay" role="dialog" aria-modal="true"></div>
<div id="sheet"></div>
<input type="file" id="photoIn" accept="image/*" hidden="">
<input type="file" id="photoImportIn" accept="application/json" hidden="">
<script src="./shopping.js"></script>
<script src="./sync.js"></script>
<script src="./recipes-ui.js"></script>
<script src="./engine.js"></script>
<script>

'use strict';
let RECIPES=[], BASE_RECIPES=[], PLAN=null, BYID={}, PHOTOS={};
let DELETED=new Set();
const DELETED_KEY='mp.deletedRecipes';
function refreshLibrary(){RECIPES=Object.values(BYID).filter(r=>!DELETED.has(r.id));}
function setRecipeDeleted(id,deleted){
  const next=new Set(DELETED);
  if(deleted)next.add(id);else next.delete(id);
  try{localStorage.setItem(DELETED_KEY,JSON.stringify([...next]));Household.track(DELETED_KEY);}
  catch(err){alert('Could not save this change. Free up browser storage and try again.');return false;}
  DELETED=next;refreshLibrary();return true;
}
let tab='library';
let filt={q:'', sec:'main', u30:false, batch:false, fav:false};
const SECTIONS=[['main','Mains'],['side','Sides'],['sauce','Sauces'],['baking','Baking']];
const secOf=r=>r.section||'main';
let CHAT=[], chatLoading=false;
const CHAT_EP='/.netlify/functions/chat';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const K={ plan:'mp.plan', hist:'mp.history', setup:'mp.setup', sides:w=>'mp.sides::'+w, prep:w=>'mp.prep::'+w, shop:w=>'mp.shop::'+w };
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch(e){return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));Household.track(k);return true;}catch(e){return false;}};
const lsRemove=k=>{localStorage.removeItem(k);Household.track(k);};
const SETUP_DEFAULT={ target_p:80, target_f:40, target_c:120, batch_scale:2, household:'Vik & Jessica' };
const setup=()=>({...SETUP_DEFAULT, ...lsGet(K.setup,{})});

let idb=null;
function idbOpen(){return new Promise((res,rej)=>{const rq=indexedDB.open('mealplanner-db',1);
  rq.onupgradeneeded=()=>rq.result.createObjectStore('photos',{keyPath:'id'});
  rq.onsuccess=()=>res(rq.result); rq.onerror=()=>rej(rq.error);});}
async function photoAll(){if(!idb)return {};return new Promise(res=>{const o={};const c=idb.transaction('photos').objectStore('photos').openCursor();
  c.onsuccess=e=>{const cur=e.target.result;if(cur){o[cur.value.id]=cur.value.data;cur.continue();}else res(o);};c.onerror=()=>res(o);});}
async function photoPut(id,data,sync=true){
  if(!idb)throw new Error('Photo storage is unavailable.');
  await new Promise((resolve,reject)=>{const tx=idb.transaction('photos','readwrite');
    tx.objectStore('photos').put({id,data,ts:Date.now()});tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);});

const FR={'¼':.25,'½':.5,'¾':.75,'⅓':1/3,'⅔':2/3,'⅕':.2,'⅖':.4,'⅗':.6,'⅘':.8,'⅙':1/6,'⅚':5/6,'⅛':.125,'⅜':.375,'⅝':.625,'⅞':.875};
const FROUT=[[.125,'⅛'],[.2,'⅕'],[.25,'¼'],[1/3,'⅓'],[.375,'⅜'],[.4,'⅖'],[.5,'½'],[.6,'⅗'],[.625,'⅝'],[2/3,'⅔'],[.75,'¾'],[.8,'⅘'],[.875,'⅞']];

function parseQty(s){s=s.trim();let m;
  if((m=s.match(/^(\d+)\s+(\d+)\/(\d+)$/)))return +m[1]+(+m[2]/+m[3]);
  if((m=s.match(/^(\d+)\/(\d+)$/)))return +m[1]/+m[2];
  if((m=s.match(/^(\d+(?:\.\d+)?)\s?([¼½¾⅓⅔⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞])$/)))return +m[1]+FR[m[2]];
  if(FR[s]!==undefined)return FR[s];
  if(WORDN[s.toLowerCase()]!==undefined)return WORDN[s.toLowerCase()];
  if(/^\d+(?:\.\d+)?$/.test(s))return +s; return null;}
function fmtQty(x){if(x<=0)return '0';const w=Math.floor(x+1e-6);let f=x-w;
  if(f<.06)return String(w||Math.round(x*100)/100);let best=null,bd=1;
  for(const[v,g]of FROUT){const d=Math.abs(f-v);if(d<bd){bd=d;best=g;}}
  if(bd>.07)return String(Math.round(x*4)/4);return (w?w:'')+best;}
const QT='(\\d+\\s\\d+\\/\\d+|\\d+\\/\\d+|\\d+(?:\\.\\d+)?\\s?[¼½¾⅓⅔⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞]|[¼½¾⅓⅔⅕⅖⅗⅘⅙⅚⅛⅜⅝⅞]|\\d+(?:\\.\\d+)?|half|quarter|one|two|three|four|six|eight)';
const UN='(tablespoons?|tbsp|teaspoons?|tsp|cups?|milliliters?|ml|liters?|l|centiliters?|cl|grams?|g|kilograms?|kg|ounces?|oz|pounds?|lbs?|lb|pints?|quarts?|cans?|cloves?|packets?|sachets?|blocks?|jars?|bottles?)';

  const raw=String(line);if(f===1)return esc(raw);
  let src=raw;const vals=[];
  const mark=v=>{vals.push(v);return '\u0001'+String.fromCharCode(0xE000+vals.length-1)+'\u0002';};
  const scaledRange=(q,range)=>{
    const lo=parseQty(q);if(lo===null)return q+(range||'');
    let out=fmtQty(lo*f);
    if(range){const hi=parseQty(range.replace(/^\\s*[–—-]\\s*/,''));if(hi!==null)out+='–'+fmtQty(hi*f);}
    return out;
  };
  const lead=new RegExp('^'+QT+'(\\s*[–—-]\\s*'+QT+')?','i');
  const m=src.match(lead);
  let primaryUnit='';
  if(m){
    const after=raw.slice(m[0].length);
    const um=after.match(new RegExp('^\\s*'+UN+'\\b','i'));primaryUnit=um?.[1]||'';
    src=mark(scaledRange(m[1],m[2]))+src.slice(m[0].length);
    const alt=new RegExp('(\\/\\s*)'+QT+'(?=\\s*'+UN+'\\b)','i');
    const a=src.match(alt);
    if(a)src=src.slice(0,a.index)+a[1]+mark(scaledRange(a[2],null))+src.slice(a.index+a[0].length);
    if(!COUNT_UNIT.test(primaryUnit)){
      const par=new RegExp('(\\(\\s*~?\\s*)'+QT+'(?=\\s*'+UN+'\\b)','i');
      const p=src.match(par);
      if(p)src=src.slice(0,p.index)+p[1]+mark(scaledRange(p[2],null))+src.slice(p.index+p[0].length);
    }

    const any=new RegExp(QT+'(?=\\s*'+UN+'\\b)','i');
    const a=src.match(any);
    if(a&&a.index<60)src=src.slice(0,a.index)+mark(scaledRange(a[1],null))+src.slice(a.index+a[0].length);
  }

/* ================= inline ingredient amounts in steps ================= */
/* Detects dry goods & spices named in a direction step and injects the
   scaled amount inline. Silent when the match is ambiguous. */

const MEASURE='(tablespoons?|tbsp|teaspoons?|tsp|cups?|milliliters?|ml|liters?|l|grams?|g|kilograms?|kg|ounces?|oz|pounds?|lbs?|lb|pinch(?:es)?|sticks?|sprigs?|inch(?:es)?|pieces?|handfuls?|knobs?|cloves?|cans?|packets?|sachets?|bunch(?:es)?|thumbs?|strips?|leaves|blocks?)';
const AMT_LEX=/\b(flours?|cornstarch|corn ?flour|semolina|cornmeal|polenta|panko|bread ?crumbs?|baking powder|baking soda|bicarbonate|yeast|gelatine?|cocoa|sugars?|jaggery|salt|msg|monosodium|peppercorns?|pepper|paprika|cumin|coriander|turmeric|cinnamon|cardamom|cloves?|nutmeg|mace|allspice|star anise|anise|fennel|caraway|mustard|fenugreek|methi|asafoetida|hing|garam masala|masala|curry powder|chilli? powder|cayenne|gochugaru|chill?i flakes|pepper flakes|five ?spice|za'?atar|sumac|oregano|thyme|rosemary|sage|basil|marjoram|tarragon|dill|bay lea\w+|sesame seeds?|nigella|ajwain|amchur|saffron|vanilla|sichuan|szechuan|dashi|gochujang|miso|cornflour|garlic powder|onion powder|soy sauce|light soy|dark soy|tamari|fish sauce|oyster sauce|hoisin|worcestershire|shaoxing|mirin|black bean sauce|doubanjiang|sriracha|gochu?jang|ketchup|tahini|tomato pur[\u00e9e]+e?|tomato paste|curry paste|aji [a-z]+ paste|chill?i crisp|chill?i oil|sesame oil|vinegar|honey|maple syrup|molasses|treacle|stock|broth|bouillon|coconut milk|coconut cream|heavy cream|double cream|single cream|buttermilk|yogh?urt|butter|milk|parmesan|parmigiano|pecorino|passata)\b/i;
/* class of a pantry entry, for expanding collective references like "the spice mix" */
const HERB_RX=/\b(coriander leaves|cilantro|parsley|mint|curry lea\w+|kasuri methi|methi leaves|dill fronds|spring onions?|scallions?|chives|basil leaves|thai basil)\b/i;
const WHOLE_RX=/\b(sticks?|pods?|peppercorns?|seeds?|star anise|bay lea\w+|whole)\b/i;
const BAKE_RX=/\b(flours?|cornstarch|cornflour|baking powder|baking soda|bicarbonate|yeast|cocoa|sugars?|semolina|cornmeal|gelatine?)\b/i;
const SPICE_RX=/\b(paprika|cumin|coriander|turmeric|cinnamon|cardamom|cloves?|nutmeg|mace|allspice|anise|fennel|caraway|mustard|fenugreek|asafoetida|hing|masala|curry powder|chilli? powder|cayenne|gochugaru|chill?i flakes|pepper flakes|five ?spice|za'?atar|sumac|oregano|thyme|rosemary|sage|marjoram|tarragon|bay lea\w+|nigella|ajwain|amchur|saffron|peppercorns?|sichuan|szechuan|garlic powder|onion powder)\b/i;
const SEASON_RX=/\b(salt|pepper|msg|monosodium)\b/i;
function entryClass(e){
  const raw=String(e.raw||'').toLowerCase();
  if(HERB_RX.test(e.name)||HERB_RX.test(raw)) return 'herb';   /* fresh herbs are prepped, never a "mix" */
  if(BAKE_RX.test(e.name)) return 'bake';
  if(SEASON_RX.test(e.name)&&!SPICE_RX.test(e.name)) return 'season';
  if(SPICE_RX.test(e.name)){
    const whole=WHOLE_RX.test(raw)||/^(inch|stick|pod|leaf|leaves|sprig)$/.test(e.unit);
    return whole?'whole':'ground';
  }
  return 'other';
}
/* collective phrases -> which entry classes they stand for */
const COLLECTIVE=[
  [/\bwhole spices?\b/i,                                                    ['whole']],
  [/\bground spices?\b/i,                                                   ['ground']],
  [/\b(?:the |all the |remaining |dry )?spice (?:mix|blend|mixture|paste)\b/i,['ground','whole','season']],
  [/\b(?:masala|spice) mix\b/i,                                             ['ground','whole','season']],
  [/\b(?:the|remaining|all the|dry) spices\b/i,                             ['ground','whole']],
  [/\bseasonings?\b/i,                                                      ['season','ground']],
  [/\bdry ingredients\b/i,                                                  ['bake']],
];
const STRIP=/\b(of|about|approx(?:imately)?|level|rounded|generous|large|small|medium|big|finely|freshly|coarsely|roughly|thinly|ground|whole|fresh|dried|toasted|granulated|caster|superfine|powdered|confectioners?'?|packed|sifted|heaping|scant|good|quality|plus more.*|to taste|for (?:dusting|frying|garnish|serving).*|or more.*|optional.*|divided.*|room temperature|chopped|minced|crushed|grated|each)\b/gi;

const RXESC=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');

function amtIndex(r){
  if(r.__amt) return r.__amt;
  const re=new RegExp('^'+QT+'(?:\\s*(?:to|–|—|-)\\s*'+QT+')?\\s*'+MEASURE+'\\b\\.?\\s*(.+)$','i');
  const entries=[];
  for(const raw of r.ingredients){
    const line=String(raw).replace(/\(([^)]*)\)/g,' ').trim();
    const m=line.match(re); if(!m) continue;
    const qty=parseQty(m[1]); if(qty===null) continue;
    const qtyHi=m[2]?parseQty(m[2]):null;
    let unit=m[3].toLowerCase().replace(/s$/,'');
    if(unit==='tablespoon')unit='tbsp'; if(unit==='teaspoon')unit='tsp';
    if(unit==='gram')unit='g'; if(unit==='kilogram')unit='kg';
    if(unit==='ounce')unit='oz'; if(unit==='pound')unit='lb';
    if(unit==='milliliter')unit='ml'; if(unit==='liter')unit='l';
    let name=m[4].replace(/,.*$/,'').replace(STRIP,' ').replace(/\s+/g,' ').trim().toLowerCase();
    if(!name||!AMT_LEX.test(name)) continue;
    const divided=/\b(divided|plus more)\b/i.test(String(raw));
    entries.push({qty,qtyHi,unit,name,divided,raw:String(raw)});
  }
  /* candidate phrases: the cleaned name, and the lexicon head inside it */
  const map=new Map();
  entries.forEach((e,i)=>{
    const keys=new Set([e.name]);
    const head=e.name.match(AMT_LEX); if(head) keys.add(head[0].toLowerCase());
    for(const k of keys){ if(k.length<3) continue;
      if(!map.has(k)) map.set(k,new Set()); map.get(k).add(i); }
  });
  /* ambiguous phrase -> drop it entirely rather than guess */
  const phrases=[];
  for(const [k,set] of map) if(set.size===1) phrases.push([k,[...set][0]]);
  phrases.sort((a,b)=>b[0].length-a[0].length);
  const blob=r.ingredients.join(' | ').toLowerCase();
  /* an ingredient named in several steps is being used across them: show the
     amount as a recipe total so a single step can't read as "add all of this" */
  const dirs=(r.directions||[]).map(d=>String(d).toLowerCase());
  for(const [k,ei] of phrases){
    const rx=new RegExp('\\b'+RXESC(k).replace(/ /g,'\\s+')+'\\b','i');
    if(dirs.filter(d=>rx.test(d)).length>1) entries[ei].multi=true;
  }
  r.__amt={entries,phrases,blob};
  return r.__amt;
}

function annotateStep(text,r,f){
  let src=String(text);
  const idx=(r&&r.ingredients)?amtIndex(r):{entries:[],phrases:[],blob:''};
  const amts=[]; const usedNames=new Set();
  if(idx.phrases.length){
    const taken=[];const ins=[];
    const qtyNear=new RegExp(QT+'\\s?'+MEASURE+'\\b[^.]{0,14}$','i');
    for(const [phrase,ei] of idx.phrases){
      const e=idx.entries[ei];
      const rx=new RegExp('\\b'+RXESC(phrase).replace(/ /g,'\\s+')+'\\b','i');
      const m=rx.exec(src); if(!m) continue;
      const a=m.index,b=a+m[0].length;
      if(taken.some(([x,y])=>a<y&&b>x)) continue;               /* inside a longer match */
      const before=src.slice(Math.max(0,a-30),a);
      if(qtyNear.test(before)) continue;                        /* step already states it */
      if(/\b(pinch|sprinkl\w*|dash|drizzle|grating|grind\w*|dusting|handful|splash|few|little|some|remaining|rest of|extra|more)\b[^.]{0,18}$/i.test(before)) continue;
      /* guard: "bell pepper", "garlic cloves", "fennel bulb" — a different ingredient */
      const prev=(before.match(/([A-Za-z'\u2019-]+)\s+$/)||[])[1];
      /* "fresh coriander" is never the ground spice, whatever the ingredient list says */
      if(prev&&/^(fresh|chopped|minced|sliced|torn|picked)$/i.test(prev)
         &&/^(ground|bake)$/.test(entryClass(e))) continue;
      if(prev && !e.name.includes(prev.toLowerCase())
         && idx.blob.includes(prev.toLowerCase()+' '+phrase)) continue;
      const after=(src.slice(b).match(/^\s+([A-Za-z]+)/)||[])[1];
      if(after && !e.name.includes(after.toLowerCase())
         && idx.blob.includes(phrase+' '+after.toLowerCase())) continue;
      taken.push([a,b]); usedNames.add(e.name);
      const v=e.qty*f, u=(v>1&&/^(cup|pinch|stick|sprig|piece|handful|knob|clove|can|inch)$/.test(e.unit))?(e.unit==='pinch'?'pinches':(e.unit==='inch'?'inches':e.unit+'s')):e.unit;
      const shown=e.qtyHi!==null&&e.qtyHi!==undefined?fmtQty(v)+'–'+fmtQty(e.qtyHi*f):fmtQty(v);
      amts.push(shown+' '+u+(e.divided?' total, divided':(e.multi?' total':'')));
      ins.push([b,'\u0001'+String.fromCharCode(0xE000+amts.length-1)+'\u0002']);
    }
    ins.sort((p,q)=>q[0]-p[0]);
    for(const [pos,tok] of ins) src=src.slice(0,pos)+tok+src.slice(pos);
  }
  /* collective references: "add the spice mix" enumerates what the mix is */
  if(idx.entries.length){
    for(const [rx,classes] of COLLECTIVE){
      const m=rx.exec(src); if(!m) continue;
      const named=e=>{const k=(e.name.match(AMT_LEX)||[e.name])[0];
        return new RegExp('\\b'+RXESC(k).replace(/ /g,'\\s+')+'\\b','i').test(src);};
      const list=idx.entries.filter(e=>classes.indexOf(entryClass(e))>=0 && !usedNames.has(e.name) && !named(e));
      if(list.length<2) continue;                 /* one item isn't a "mix" */
      const seen=new Set(); const parts=[];
      for(const e of list){
        if(seen.has(e.name)) continue; seen.add(e.name);
        const v=e.qty*f;
        const u=(v>1&&/^(cup|pinch|stick|sprig|piece|handful|knob|clove|can|inch|pod|leaf)$/.test(e.unit))
          ?(e.unit==='pinch'?'pinches':e.unit==='inch'?'inches':e.unit==='leaf'?'leaves':e.unit+'s')
          :e.unit;
        const shown=(e.qtyHi!==null&&e.qtyHi!==undefined)?fmtQty(v)+'\u2013'+fmtQty(e.qtyHi*f):fmtQty(v);
        parts.push(shown+' '+u+' '+e.name);
      }
      if(parts.length<2) continue;
      amts.push(parts.join(' \u00b7 '));
      const tok='\u0001'+String.fromCharCode(0xE000+amts.length-1)+'\u0002';
      const at=m.index+m[0].length;
      src=src.slice(0,at)+tok+src.slice(at);
      break;                                      /* one expansion per step */
    }
  }
  /* scaleStep escapes and highlights the quantities already written in the step.
     The tokens carry no digits, so they survive that pass untouched. */
  return scaleStep(src,f).replace(/\u0001([\uE000-\uF8FF])\u0002/g,
    (a,c)=>' <span class="amt">('+esc(amts[c.charCodeAt(0)-0xE000])+')</span>');
}

/* ============================== cook mode ============================== */
let COOK=null, REDRAW=null;

const TIME_RX=/\b(\d+(?:\.\d+)?)\s*(?:(?:to|–|—|-)\s*\d+(?:\.\d+)?\s*)?(hours?|hrs?|minutes?|mins?|seconds?|secs?)\b/i;
function stepSeconds(t){
  const m=TIME_RX.exec(String(t)); if(!m) return null;
  const n=parseFloat(m[1]),u=m[2].toLowerCase();
  const s=/^h/.test(u)?n*3600:/^m/.test(u)?n*60:n;
  return (s>=30&&s<=4*3600)?Math.round(s):null;
}
const mmss=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;
  return (h?h+':'+String(m).padStart(2,'0'):String(m))+':'+String(x).padStart(2,'0');};

async function wakeOn(){
  try{ if('wakeLock' in navigator && (!COOK.lock||COOK.lock.released))
    COOK.lock=await navigator.wakeLock.request('screen'); }catch(e){}
}
function wakeOff(){ try{ COOK&&COOK.lock&&COOK.lock.release(); }catch(e){} if(COOK)COOK.lock=null; }
document.addEventListener('visibilitychange',()=>{ if(COOK&&document.visibilityState==='visible')wakeOn(); });

function openCook(){
  const r=BYID[openId]; if(!r||!r.directions.length) return;
  COOK={r,i:0,lock:null,timer:null,left:0,total:0,ing:false};
  const el=document.createElement('div'); el.id='cook'; document.body.appendChild(el);
  drawCook(); wakeOn();
  el.addEventListener('touchstart',e=>{COOK.x=e.changedTouches[0].clientX;COOK.y=e.changedTouches[0].clientY;},{passive:true});
  el.addEventListener('touchend',e=>{
    if(COOK.ing) return;
    const dx=e.changedTouches[0].clientX-COOK.x, dy=e.changedTouches[0].clientY-COOK.y;
    if(Math.abs(dx)>48&&Math.abs(dx)>Math.abs(dy)*1.6) stepBy(dx<0?1:-1);
  },{passive:true});
  document.addEventListener('keydown',cookKeys);
}
function cookKeys(e){ if(!COOK)return;
  if(e.key==='ArrowRight'||e.key===' ')  {e.preventDefault();stepBy(1);}
  if(e.key==='ArrowLeft')  stepBy(-1);
  if(e.key==='Escape') closeCook();
}
function closeCook(){
  if(!COOK)return; clearInterval(COOK.timer); wakeOff();
  document.removeEventListener('keydown',cookKeys);
  const el=document.getElementById('cook'); if(el)el.remove();
  COOK=null; if(typeof REDRAW==='function')REDRAW();
}
function stepBy(d){
  if(!COOK)return; const n=COOK.i+d;
  if(n<0) return; if(n>=COOK.r.directions.length){ closeCook(); return; }
  clearInterval(COOK.timer); COOK.timer=null; COOK.left=0; COOK.i=n; COOK.ing=false; drawCook();
}
function tickTimer(){
  COOK.left--;
  const t=document.getElementById('ctime'); if(t)t.textContent=mmss(Math.max(0,COOK.left));
  const ring=document.getElementById('cring');
  if(ring&&COOK.total)ring.style.width=(100-COOK.left/COOK.total*100).toFixed(1)+'%';
  if(COOK.left<=0){
    clearInterval(COOK.timer); COOK.timer=null;
    try{navigator.vibrate&&navigator.vibrate([250,120,250,120,400]);}catch(e){}
    const b=document.getElementById('ctimer'); if(b)b.classList.add('done');
    if(t)t.textContent='done';
  }
}
function drawCook(){
  const {r,i}=COOK, f=servSel/r.serves.n, n=r.directions.length;
  const secs=stepSeconds(r.directions[i]);
  const el=document.getElementById('cook');
  el.className=COOK.ing?'ing-open':'';
  el.innerHTML=`
    <div class="c-top">
      <button class="c-x" data-cx>✕</button>
      <div class="c-name">${esc(r.name)}</div>
      <div class="c-count">${i+1}<span>/${n}</span></div>
    </div>
    <div class="c-bar"><i style="width:${((i+1)/n*100).toFixed(1)}%"></i></div>
    <div class="c-body">
      <div class="c-step">${annotateStep(r.directions[i],r,f)}</div>
      ${secs?`<button class="c-timer" id="ctimer" data-timer="${secs}">
        <i id="cring"></i><span id="ctime">${mmss(COOK.left||secs)}</span>
        <em>${COOK.timer?'tap to stop':'start timer'}</em></button>`:''}
    </div>
    <div class="c-nav">
      <button data-go="-1" ${i===0?'disabled':''}>←</button>
      <button class="c-ings" data-ings>Ingredients</button>
      <button data-go="1">${i===n-1?'Done':'→'}</button>
    </div>
    <div class="c-tray">
      <button class="c-grab" data-ings></button>
      <div class="c-tray-in"><span class="label">Ingredients · serves ${servSel}</span>
        ${r.ingredients.map((x,k)=>`<button class="ing ${strikes['i'+k]?'done':''}" data-cstrike="i${k}">${scaleIng(x,f)}</button>`).join('')}
      </div>
    </div>`;
  el.onclick=e=>{
    const t=e.target.closest('[data-cx],[data-go],[data-ings],[data-timer],[data-cstrike]');
    if(!t)return;
    if(t.dataset.cx!==undefined){closeCook();return;}
    if(t.dataset.go){stepBy(+t.dataset.go);return;}
    if(t.dataset.ings!==undefined){COOK.ing=!COOK.ing;el.className=COOK.ing?'ing-open':'';return;}
    if(t.dataset.cstrike){const k=t.dataset.cstrike;strikes[k]=!strikes[k];t.classList.toggle('done');return;}
    if(t.dataset.timer){
      if(COOK.timer){clearInterval(COOK.timer);COOK.timer=null;COOK.left=0;drawCook();return;}
      COOK.total=+t.dataset.timer;COOK.left=COOK.total;
      COOK.timer=setInterval(tickTimer,1000);drawCook();return;}
  };
}

</script>
